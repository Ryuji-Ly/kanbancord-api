spring.application.name=kanbancord-api
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Management Endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Internal sync auth (Discord bot) - store the SHA-256 hex hash here, bot sends the raw token
kanbancord.internal-sync.bot-token=${KANBANCORD_BOT_TOKEN:}

# App auth + Discord identity mapping
kanbancord.auth.jwt.secret=${KANBANCORD_JWT_SECRET:}
# Access tokens are short-lived and kept in memory by the web app; it renews them with the refresh
# cookie, which lasts refresh-ttl-days after its last use. Signing out revokes both at once.
kanbancord.auth.jwt.expiration-seconds=900
kanbancord.auth.session.refresh-ttl-days=30
kanbancord.auth.session.cookie-secure=${KANBANCORD_SESSION_COOKIE_SECURE:true}
# Encrypts stored Discord tokens (32 bytes, base64). Derived from the JWT secret when unset.
kanbancord.auth.token-encryption-key=${KANBANCORD_TOKEN_ENCRYPTION_KEY:}
kanbancord.cors.allowed-origins=${KANBANCORD_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://kanbancord.com,https://www.kanbancord.com}
kanbancord.realtime.allowed-origins=${KANBANCORD_REALTIME_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://kanbancord.com,https://www.kanbancord.com}
kanbancord.realtime.ticket-ttl-seconds=30
kanbancord.realtime.access-cache-ttl-seconds=10

# Rate limits (token buckets: capacity = burst, per-minute = refill rate)
kanbancord.rate-limit.enabled=${KANBANCORD_RATE_LIMIT_ENABLED:true}
kanbancord.rate-limit.auth.capacity=20
kanbancord.rate-limit.auth.per-minute=10
kanbancord.rate-limit.session.capacity=60
kanbancord.rate-limit.session.per-minute=30
kanbancord.rate-limit.read.capacity=600
kanbancord.rate-limit.read.per-minute=600
kanbancord.rate-limit.write.capacity=300
kanbancord.rate-limit.write.per-minute=300
kanbancord.rate-limit.upload.capacity=10
kanbancord.rate-limit.upload.per-minute=2

# Images and videos are stored on Imgur; the API only passes them through.
kanbancord.imgur.client-id=${KANBANCORD_IMGUR_CLIENT_ID:}
# Larger than any accepted file (videos are capped at 50 MB), so the size check can explain itself.
spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=56MB

# Take the client IP from Cloudflare's CF-Connecting-IP header, but only when the request comes from a
# private-network proxy (production: Cloudflare -> nginx on the host -> this container). Clients that can
# reach nginx without going through Cloudflare could set it themselves; restrict nginx to Cloudflare's IPs.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
server.tomcat.remoteip.remote-ip-header=${SERVER_REMOTE_IP_HEADER:CF-Connecting-IP}
kanbancord.discord.api-base-url=https://discord.com/api/v10
kanbancord.discord.oauth.client-id=${KANBANCORD_DISCORD_CLIENT_ID:}
kanbancord.discord.oauth.client-secret=${KANBANCORD_DISCORD_CLIENT_SECRET:}
