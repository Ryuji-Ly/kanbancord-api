spring.application.name=kanbancord-api
spring.datasource.url=jdbc:postgresql://localhost:5432/kanbancord_v2
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Management Endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Internal sync auth (Discord bot)
kanbancord.internal-sync.bot-token=${KANBANCORD_BOT_TOKEN:}

# App auth + Discord identity mapping
kanbancord.auth.jwt.secret=${KANBANCORD_JWT_SECRET:}
kanbancord.auth.jwt.expiration-seconds=86400
kanbancord.discord.api-base-url=https://discord.com/api/v10
kanbancord.discord.oauth.client-id=${KANBANCORD_DISCORD_CLIENT_ID:}
kanbancord.discord.oauth.client-secret=${KANBANCORD_DISCORD_CLIENT_SECRET:}
